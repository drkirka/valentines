<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Valentines</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="bg" aria-hidden="true"></div>

  <div class="wrap">

    <div id="startOverlay" class="overlay">
      <div class="overlayCard">

        <div class="overlayTitle">
          🐱💘 Valentine Valentinovich
        </div>

        <div id="overlayText" class="overlayText">
          Staaarting!!! ✨
        </div>

        <button id="startBtn" class="startBtn" type="button">
          Start 💖
        </button>

        <div class="overlayHint">
          Don't worry, photos are not saved... unfortunately
        </div>

      </div>
    </div>

    <div class="videoBox">
      <video id="video" playsinline webkit-playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="ui">

      <div id="title">
        Countdown!
      </div>

      <div id="subtitle">
        Show the number with your hand
      </div>

      <div id="bigNumber">
        5
      </div>

      <div id="hold" class="hold hidden">
        <div id="holdLabel" class="holdLabel">
          Hold…
        </div>

        <div class="bar">
          <div id="holdFill" class="fill"></div>
        </div>
      </div>

      <div id="card" class="card hidden">
        <img id="cardImg" alt="" />
        <div id="cardText"></div>
      </div>

      <div id="snapWrap" class="hidden">
        <div id="snapText" class="snapText">
          confused the coordinate system
        </div>

        <img id="snapImg" alt="snapshot" />
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

  <script src="script.js"></script>

</body>
</html>
